# Conversation tracing is configured separately in project-local hooks.json.

[mcp_servers.mysql]
command = "npx"
args = ["-y", "@toolbox-sdk/server@latest", "--prebuilt", "mysql", "--stdio"]
env_vars = ["MYSQL_HOST", "MYSQL_PORT", "MYSQL_DATABASE", "MYSQL_USER", "MYSQL_PASSWORD"]
startup_timeout_sec = 120

[mcp_servers.aws-mcp]
command = "uvx"
args = ["mcp-proxy-for-aws@1.6.3", "https://aws-mcp.us-east-1.api.aws/mcp"]
env_vars = ["AWS_PROFILE", "AWS_REGION", "AWS_DEFAULT_REGION", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE"]
startup_timeout_sec = 120

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v2/mcp"

[mcp_servers.tableau]
command = "sh"
args = ["-c", "export SERVER=\"$TABLEAU_SERVER\" SITE_NAME=\"$TABLEAU_SITE_NAME\" PAT_NAME=\"$TABLEAU_PAT_NAME\" PAT_VALUE=\"$TABLEAU_PAT_VALUE\" AUTH=\"${TABLEAU_AUTH:-pat}\"; exec npx -y @tableau/mcp-server@6.0.4"]
env_vars = ["TABLEAU_SERVER", "TABLEAU_SITE_NAME", "TABLEAU_PAT_NAME", "TABLEAU_PAT_VALUE", "TABLEAU_AUTH"]
startup_timeout_sec = 120
